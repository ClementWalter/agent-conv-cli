# Web and worker use the same key and private database; no user history is bundled into the image.
services:
  - type: web
    name: oneconv
    runtime: docker
    plan: starter
    region: frankfurt
    healthCheckPath: /health
    envVars:
      - key: APP_MODE
        value: hosted
      - key: DATABASE_URL
        fromDatabase:
          name: oneconv-db
          property: connectionString
      - key: SESSION_ENCRYPTION_KEY
        generateValue: true
      - key: WORKOS_CLIENT_ID
        sync: false
      - key: WORKOS_API_KEY
        sync: false
      - key: WORKOS_AUTHKIT_DOMAIN
        sync: false
      - key: BROWSERBASE_API_KEY
        sync: false
      - key: BROWSERBASE_PROJECT_ID
        sync: false
  - type: worker
    name: oneconv-sync
    runtime: docker
    plan: starter
    region: frankfurt
    envVars:
      - key: APP_MODE
        value: hosted
      - key: WORKER_ONLY
        value: "true"
      - key: PUBLIC_URL
        fromService:
          type: web
          name: oneconv
          envVarKey: RENDER_EXTERNAL_URL
      - key: DATABASE_URL
        fromDatabase:
          name: oneconv-db
          property: connectionString
      - key: SESSION_ENCRYPTION_KEY
        fromService:
          type: web
          name: oneconv
          envVarKey: SESSION_ENCRYPTION_KEY
databases:
  - name: oneconv-db
    plan: basic-256mb
    region: frankfurt
    ipAllowList: []
